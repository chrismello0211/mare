<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maré — hidratação no seu ritmo</title>
<meta name="description" content="Metas inteligentes, lembretes que respeitam sua rotina e conquistas para você beber água no ritmo certo.">
<meta name="theme-color" content="#F3F8FC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maré">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script>
  /* aplica o tema antes da primeira pintura (evita "flash" claro/escuro) */
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('mare:v1') || '{}');
      var t = (s.profile && s.profile.theme) || 'auto';
      if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#06121F' : '#F3F8FC');
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div id="app" class="app">
    <main id="view" class="wrap" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar" aria-label="Navegação principal" hidden></nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-action="close-sheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="fx" class="fx" aria-hidden="true"></div>

  <noscript><p class="nojs">Ative o JavaScript para usar o Maré.</p></noscript>
  <script nomodule>
    document.getElementById('view').innerHTML = '<p class="nojs">Seu navegador é antigo demais para o Maré. Atualize o sistema ou use o Chrome/Safari mais recente.</p>';
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
